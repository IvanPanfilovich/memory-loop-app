<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png?v=2" />

    <!-- Primary meta tags -->
    <title>Memory Loop — Turn every podcast into a mini-course you actually remember</title>
    <meta
      name="description"
      content="Paste a YouTube link, choose the themes you care about, and get a short AI-generated recap podcast plus flashcards to lock in the key ideas."
    />
    <meta
      name="keywords"
      content="Memory Loop, AI recap, podcast summary, YouTube to podcast, flashcards, spaced repetition, learning app"
    />
    <meta name="author" content="Ivan Panfilovich" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://memoryloop.co" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Memory Loop — Turn every podcast into a mini-course you actually remember"
    />
    <meta
      property="og:description"
      content="Paste a YouTube link, choose the themes you care about, and get a short AI-generated recap podcast plus flashcards to lock in the key ideas."
    />
    <meta property="og:url" content="https://memoryloop.co" />
    <meta property="og:site_name" content="Memory Loop" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Memory Loop — Turn every podcast into a mini-course you actually remember"
    />
    <meta
      name="twitter:description"
      content="Paste a YouTube link, choose the themes you care about, and get a short AI-generated recap podcast plus flashcards to lock in the key ideas."
    />

    <!-- PWA / platform -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="apple-mobile-web-app-title" content="Memory Loop" />
    <meta name="application-name" content="Memory Loop" />
    <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      /* Set theme-aware background color */
      html,
      body {
        background-color: hsl(var(--background));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
