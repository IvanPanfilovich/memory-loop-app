server {
    listen 80;
    server_name _;
    # Update this path to point to your dist directory after building
    # Example: root /var/www/memory-loop/dist;
    # Or: root /app/dist;
    root /app/dist;
    index index.html;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Handle manifest file with correct content-type
    location ~* \.webmanifest$ {
        add_header Content-Type "application/manifest+json" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Handle service worker files - no cache
    location ~* (sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Handle static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Handle JSON files (locales, data, etc.)
    location ~* \.(json)$ {
        add_header Content-Type "application/json" always;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Handle markdown files (legal documents)
    location ~* \.(md)$ {
        add_header Content-Type "text/markdown; charset=utf-8" always;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Handle HTML files - short cache
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Handle API routes (if any)
    # Legacy email confirmation link (previously pointed to frontend /api/auth/confirm).
    # Redirect to backend confirmation endpoint, which will redirect back to /email-confirmation.
    location = /api/auth/confirm {
        return 302 https://api.memoryloop.co/api/auth/confirm$is_args$args;
    }

    location = /api/auth/confirm/ {
        return 302 https://api.memoryloop.co/api/auth/confirm$is_args$args;
    }

    location /api/ {
        # Add your API proxy configuration here if needed
        return 404;
    }

    # Handle all other routes - fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide nginx version
    server_tokens off;

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
